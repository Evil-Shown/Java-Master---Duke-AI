name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install backend deps
        run: |
          cd backend
          npm install
      - name: Typecheck backend
        run: |
          cd backend
          npx tsc --noEmit
      - name: Install frontend deps
        run: |
          cd frontend
          npm install
      - name: Typecheck frontend
        run: |
          cd frontend
          npx tsc --noEmit
