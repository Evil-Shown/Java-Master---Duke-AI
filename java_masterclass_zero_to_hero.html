<script>
var CUR=[
  {title:"Getting Started",icon:"🚀",color:"#F89820",lessons:[
    {emoji:"☕",title:"What is Java?",tagline:"The language that runs everywhere",
     analogy:"Think of Java like a universal translator — write code ONCE, and it runs on Windows, Mac, Linux, Android, ATMs, and smart TVs! This is WORA: Write Once, Run Anywhere. The magic: Java compiles to bytecode, not machine code, and the JVM (Java Virtual Machine) runs that bytecode on ANY platform.",
     content:["Java was created by James Gosling at Sun Microsystems in **1995**. Today it powers Android apps, banking systems, Netflix, Amazon, and Spring Boot backends — like your own GSAP platform!","The three essential components:\n• **JDK** (Java Development Kit) — you install this to WRITE and compile Java code\n• **JRE** (Java Runtime Environment) — end users install this to RUN Java programs\n• **JVM** (Java Virtual Machine) — the engine inside JRE that executes bytecode","Java's superpowers: **strongly typed** (fewer runtime bugs), **object-oriented** (organized code), **garbage collected** (no manual memory), and has a massive ecosystem of libraries and frameworks."],
     code:"// Java's brilliant WORA architecture\n/*\n  YourCode.java\n       ↓  javac (compiler)\n  YourCode.class  ← bytecode\n       ↓  JVM interprets\n  Windows / Mac / Linux / Android\n         ALL THE SAME!\n*/\n\n// Java's 4 core principles:\n// 1. Object-Oriented  — everything is an object\n// 2. Platform Independent — Write Once, Run Anywhere  \n// 3. Robust — strong typing + garbage collection\n// 4. Secure — sandbox model, no raw pointers\n\n// Sneak peek at Java code:\npublic class HelloWorld {\n    public static void main(String[] args) {\n        System.out.println(\"Java is everywhere! ☕\");\n    }\n}",
     tips:["Java is #1 for enterprise backends — Spring Boot (your GSAP!) runs on Java","Android apps are written in Java or Kotlin (which also runs on the JVM!)","Java 21 is the latest LTS version — modern Java has records, sealed classes, pattern matching"],
     quiz:{q:"What does WORA stand for in Java?",opts:["Write Often, Refactor Always","Write Once, Run Anywhere","Work On Real Applications","Write Only Robust Apps"],correct:1}},
    {emoji:"👋",title:"Hello, World!",tagline:"Your very first Java program — dissected",
     analogy:"Every programmer remembers their first Hello World! In Java, even this tiny program has a LOT going on — nothing is random. Every single keyword has a specific reason. Let's dissect it word by word so you understand it completely from day one.",
     content:["In Java, **every piece of code must live inside a class**. The class name MUST match the filename exactly: `HelloWorld.java` → class `HelloWorld`. Case-sensitive!","Breaking down `public static void main(String[] args)` — the most important line in Java:\n• **public** — anyone can call this (the JVM needs to call it)\n• **static** — belongs to the class itself, not an object instance\n• **void** — returns nothing to the caller\n• **main** — the MAGIC name JVM searches for as entry point\n• **String[] args** — array of command-line arguments","Three ways to output text: `System.out.println()` prints + newline, `System.out.print()` prints without newline, `System.out.printf()` for formatted output with format specifiers like `%s` (String), `%d` (int), `%f` (float)."],
     code:"// File MUST be named: HelloWorld.java\npublic class HelloWorld {\n\n    // JVM starts execution HERE — every word matters!\n    public static void main(String[] args) {\n\n        // println = print + newline\n        System.out.println(\"Hello, World! ☕\");\n        System.out.println(\"I am learning Java!\");\n\n        // print = NO newline (stays on same line)\n        System.out.print(\"No \");\n        System.out.print(\"line \");\n        System.out.println(\"break!\");\n\n        // printf = formatted output\n        String name = \"Damitha\";\n        int year = 2025;\n        System.out.printf(\"Welcome %s! Year: %d%n\", name, year);\n\n        // String concatenation with +\n        System.out.println(\"Hello, \" + name + \"!\");\n    }\n}\n// OUTPUT:\n// Hello, World! ☕\n// I am learning Java!\n// No line break!\n// Welcome Damitha! Year: 2025\n// Hello, Damitha!",
     tips:["Java is CASE SENSITIVE — String != string, Main != main","Semicolons end every statement — the most common beginner mistake!","Class name must EXACTLY match the filename, including case"],
     quiz:{q:"Which is the correct entry point for a Java application?",opts:["public void start()","void main()","public static void main(String[] args)","static void run()"],correct:2}}
  ]},
  {title:"Building Blocks",icon:"📦",color:"#3B82F6",lessons:[
    {emoji:"📦",title:"Variables & Data Types",tagline:"Java's typed boxes for storing data",
     analogy:"Variables are labeled boxes — each box has a specific TYPE that the compiler enforces. An int box holds ONLY whole numbers. A String box holds ONLY text. A boolean box holds ONLY true or false. Java is strict — you can't put the wrong type in. This strictness prevents entire categories of bugs at compile time!",
     content:["Java has **8 primitive types** (stored directly in stack memory):\n• **byte** — 8-bit integer (-128 to 127)\n• **short** — 16-bit integer\n• **int** — 32-bit integer ← most common!\n• **long** — 64-bit integer (needs L suffix: 8000000000L)\n• **float** — 32-bit decimal (needs f suffix: 3.14f)\n• **double** — 64-bit decimal ← preferred for decimals!\n• **char** — single character ('A'), use SINGLE quotes\n• **boolean** — only true or false","**Reference types** (objects on heap): String, arrays, and every class you create. String uses double quotes. It's technically a class but feels like a primitive.","**Java 10+ var** — local variable type inference. The compiler deduces the type. Use `final` for constants (convention: UPPER_SNAKE_CASE)."],
     code:"public class DataTypes {\n    public static void main(String[] args) {\n\n        // INTEGER TYPES\n        byte age = 25;               // -128 to 127\n        short year = 2025;           // up to ~32,000\n        int score = 150000;          // most common, up to ~2 billion\n        long worldPop = 8000000000L; // needs L suffix!\n\n        // DECIMAL TYPES\n        float price = 9.99f;         // needs f suffix\n        double pi = 3.141592653589;  // preferred — more precise\n\n        // OTHER PRIMITIVES\n        char grade = 'A';            // SINGLE quotes, one char\n        boolean isJavaFun = true;    // only true or false\n\n        // REFERENCE TYPE\n        String name = \"Damitha\";     // DOUBLE quotes, object on heap\n\n        // JAVA 10+ var (type inference)\n        var city = \"Colombo\";        // compiler sees: String\n        var count = 42;              // compiler sees: int\n\n        // CONSTANTS — final = cannot reassign\n        final double GRAVITY = 9.81;\n        final int MAX_SIZE = 1000;\n\n        // TYPE CASTING (convert between types)\n        double d = 9.99;\n        int truncated = (int) d;     // 9 — decimal dropped!\n\n        System.out.println(name + \", age: \" + age);\n        System.out.println(\"Java fun? \" + isJavaFun);\n    }\n}",
     tips:["Use int for most integers, double for most decimals — these are the defaults","long NEEDS L suffix: 8000000000L — without it you get a compile error!","var only works for LOCAL variables, not class fields or method parameters","final makes a variable a constant — assign once, never change again"],
     quiz:{q:"Which data type is preferred for storing decimal numbers like 3.14159?",opts:["float","int","double","long"],correct:2}},
    {emoji:"➕",title:"Operators",tagline:"Tools for computing and comparing",
     analogy:"Operators are your tools. Arithmetic operators are a calculator. Comparison operators are judges — they always return true or false. Logical operators chain conditions. The ternary is a one-line if/else. Master these and you control all program logic!",
     content:["**Arithmetic**: `+` `-` `*` `/` `%` — WATCH OUT: integer division truncates! `7 / 2 = 3` not 3.5. Use `7.0 / 2` or cast `(double)7 / 2` to get 3.5. The `%` operator gives the remainder.",**Comparison** always returns boolean: `==` `!=` `>` `<` `>=` `<=`. For Strings, NEVER use `==` — use `.equals()` instead!","**Logical**: `&&` (AND — both must be true), `||` (OR — one is enough), `!` (NOT). They **short-circuit** — if `a` is false, `a && b` never evaluates `b`. Great for null-safety!","**Ternary operator** `condition ? valueIfTrue : valueIfFalse` is perfect for simple one-liner conditions and variable assignments."],
     code:"public class Operators {\n    public static void main(String[] args) {\n\n        // ARITHMETIC\n        int a = 10, b = 3;\n        System.out.println(a + b);        // 13\n        System.out.println(a - b);        // 7\n        System.out.println(a * b);        // 30\n        System.out.println(a / b);        // 3 ← integer division!\n        System.out.println(a % b);        // 1 ← remainder\n        System.out.println((double)a / b);// 3.333...\n\n        // COMPARISON (always returns boolean)\n        System.out.println(a > b);        // true\n        System.out.println(a == b);       // false\n        System.out.println(a != b);       // true\n\n        // LOGICAL\n        boolean hasJob = true, hasExp = true;\n        System.out.println(hasJob && hasExp); // true (both!)\n        System.out.println(false || hasExp);  // true (one is enough)\n        System.out.println(!hasJob);          // false\n\n        // Short-circuit — safe null check!\n        String s = null;\n        if (s != null && s.length() > 0) {  // won't NPE — s != null is false\n            System.out.println(\"Has content\");\n        }\n\n        // ASSIGNMENT SHORTCUTS\n        int x = 10;\n        x += 5;  // x = 15\n        x -= 3;  // x = 12\n        x *= 2;  // x = 24\n        x /= 4;  // x = 6\n        x++;     // x = 7 (post-increment)\n        ++x;     // x = 8 (pre-increment)\n\n        // TERNARY — one-liner if/else\n        int age = 20;\n        String type = age >= 18 ? \"Adult\" : \"Minor\";\n        System.out.println(type); // Adult\n    }\n}",
     tips:["7/2 = 3 in Java! Use 7.0/2 or (double)7/2 to get 3.5","% (modulo) is great for even/odd: if(x % 2 == 0) means even!","Short-circuit && prevents NullPointerExceptions — always check null first","NEVER use == to compare Strings — use .equals() or .equalsIgnoreCase()"],
     quiz:{q:"What is the result of 17 % 5 in Java?",opts:["3","2","1","3.4"],correct:1}},
    {emoji:"📝",title:"Strings",tagline:"Java's immutable text powerhouse",
     analogy:"A String is a pearl necklace — characters strung together. But here's the twist: it's IMMUTABLE. Once created, it can't be changed. Calling .toUpperCase() doesn't change the original — it creates a NEW String. This makes Strings thread-safe and perfect as HashMap keys. For building strings in a loop, always use StringBuilder!",
     content:["**String is immutable** — `str.toUpperCase()` returns a NEW String, `str` itself is unchanged. This trips up beginners constantly!","**Essential methods**: `.length()`, `.charAt(i)`, `.substring(start, end)`, `.indexOf(str)`, `.contains(str)`, `.startsWith(s)`, `.endsWith(s)`, `.replace(old, new)`, `.split(delim)`, `.trim()`, `.toUpperCase()`, `.toLowerCase()`, `.equals()`, `.equalsIgnoreCase()`","**StringBuilder** is mutable and fast for building strings dynamically. Key methods: `.append()`, `.insert()`, `.delete()`, `.reverse()`, `.toString()`","**Never use == for String comparison** — `==` compares memory addresses (references), `.equals()` compares actual content."],
     code:"public class Strings {\n    public static void main(String[] args) {\n\n        String name = \"  Damitha Perera  \";\n\n        // BASIC OPERATIONS — none modify original!\n        System.out.println(name.length());         // 18\n        System.out.println(name.trim());           // \"Damitha Perera\"\n        System.out.println(name.toUpperCase());    // \"  DAMITHA PERERA  \"\n\n        String clean = name.trim(); // clean is a new String\n\n        // SEARCHING\n        System.out.println(clean.contains(\"Perera\")); // true\n        System.out.println(clean.startsWith(\"Dam\"));  // true\n        System.out.println(clean.indexOf(\"P\"));       // 8\n        System.out.println(clean.isEmpty());          // false\n\n        // EXTRACTING\n        System.out.println(clean.substring(0, 7));  // \"Damitha\"\n        System.out.println(clean.charAt(0));        // 'D'\n\n        // REPLACING & SPLITTING\n        System.out.println(clean.replace(\"Perera\",\"Silva\")); // Damitha Silva\n        String csv = \"java,kotlin,python,rust\";\n        String[] langs = csv.split(\",\");\n        System.out.println(langs.length); // 4\n        System.out.println(langs[0]);     // java\n\n        // COMPARISON — ALWAYS .equals(), NEVER ==!\n        String s1 = \"Java\";\n        String s2 = new String(\"Java\");\n        System.out.println(s1.equals(s2));           // true  ✅\n        System.out.println(s1.equalsIgnoreCase(\"java\")); // true ✅\n        // s1 == s2 → FALSE! (different objects in heap) ❌\n\n        // STRINGBUILDER — fast for building dynamically!\n        StringBuilder sb = new StringBuilder();\n        for (int i = 1; i <= 5; i++) {\n            sb.append(\"item\").append(i).append(\", \");\n        }\n        System.out.println(sb.toString()); // item1, item2, item3, item4, item5,\n\n        // Java 15+ TEXT BLOCK (multi-line string)\n        String json = \"\"\"\n                {\n                  \"name\": \"Damitha\",\n                  \"lang\": \"Java\"\n                }\n                \"\"\";\n        System.out.println(json);\n    }\n}",
     tips:["Strings are immutable — str.toUpperCase() doesn't change str, it returns new!","ALWAYS .equals() for String comparison, NEVER ==","Use StringBuilder in loops — String + String in a loop creates many garbage objects","String.format() is cleaner than chaining + when you have many variables"],
     quiz:{q:"Why should you use .equals() instead of == to compare Strings?",opts:["== is slower for Strings","Strings are objects — == compares references, not content","== throws an exception for Strings","There is no difference"],correct:1}}
  ]},
  {title:"Control Flow",icon:"🔀",color:"#10B981",lessons:[
    {emoji:"🚦",title:"If/Else & Switch",tagline:"Making decisions in your code",
     analogy:"if/else is a traffic light — green means go, yellow means slow, red means stop. switch is a TV remote — press 1 for BBC, press 5 for Netflix. Use if/else for complex boolean conditions. Use switch for checking one variable against many known values. Java 14+ switch expressions are a massive upgrade — cleaner, safer, no fall-through!",
     content:["**if/else chains** evaluate conditions top-to-bottom. First true condition executes its block and skips the rest. The `else` is the catch-all default. Keep nesting shallow (max 2-3 levels) for readability.","**Classic switch**: each `case` needs `break` or execution falls through to the next case — a famous source of bugs! Java 14+ **switch expressions** use `->` — no fall-through, no break needed, much cleaner.","**Pattern matching instanceof** (Java 16+): `if (obj instanceof String s)` checks type AND assigns to variable in one step. Replaces the old cast-after-check pattern."],
     code:"public class ControlFlow {\n    public static void main(String[] args) {\n\n        // BASIC IF / ELSE IF / ELSE\n        int score = 85;\n        if (score >= 90) {\n            System.out.println(\"Grade: A — Excellent!\");\n        } else if (score >= 80) {\n            System.out.println(\"Grade: B — Good job!\"); // this runs\n        } else if (score >= 70) {\n            System.out.println(\"Grade: C — Okay.\");\n        } else {\n            System.out.println(\"Grade: F — Study harder!\");\n        }\n\n        // CLASSIC SWITCH (watch the break!)\n        String day = \"FRIDAY\";\n        switch (day) {\n            case \"MONDAY\":\n            case \"TUESDAY\":                  // fall-through — shares result\n            case \"WEDNESDAY\":\n                System.out.println(\"Grind!\");\n                break;\n            case \"FRIDAY\":\n                System.out.println(\"TGIF!\"); // runs\n                break;\n            default:\n                System.out.println(\"Midweek...\");\n        }\n\n        // MODERN SWITCH EXPRESSION (Java 14+) — SO MUCH BETTER!\n        String vibe = switch (day) {\n            case \"MONDAY\", \"TUESDAY\", \"WEDNESDAY\" -> \"Weekday grind\";\n            case \"THURSDAY\" -> \"Almost there!\";\n            case \"FRIDAY\" -> \"TGIF! Weekend incoming\";\n            case \"SATURDAY\", \"SUNDAY\" -> \"Weekend mode!\";\n            default -> \"Unknown\";\n        };\n        System.out.println(vibe); // TGIF! Weekend incoming\n\n        // PATTERN MATCHING instanceof (Java 16+)\n        Object obj = \"Hello Java!\";\n        if (obj instanceof String s && s.length() > 5) {\n            System.out.println(\"Long string: \" + s.toUpperCase());\n        }\n\n        // TERNARY — one-liner if/else\n        int age = 20;\n        String label = age >= 18 ? \"Adult\" : \"Minor\";\n        System.out.println(label); // Adult\n    }\n}",
     tips:["ALWAYS prefer modern switch expression (Java 14+) — no break, no fall-through bugs","Classic switch: forget break = silent fall-through = frustrating bug","Ternary is great for simple assignments, but don't nest them more than 2 levels","Pattern matching instanceof (Java 16+) is cleaner than old instanceof + cast"],
     quiz:{q:"What happens if you forget 'break' in a classic switch case?",opts:["Compilation error","NullPointerException","Execution falls through to the next case","Nothing — break is optional"],correct:2}},
    {emoji:"🔄",title:"Loops",tagline:"Efficient repetition — the assembly line",
     analogy:"Loops are your assembly line — do this action 1000 times without writing it 1000 times. for loop: you KNOW the count upfront (e.g., print 1 to 100). while loop: you DON'T know the count (keep going until condition fails). do-while: must run at least ONCE (user input validation). for-each: the cleanest way to walk through a collection.",
     content:["**Classic for** `for(init; condition; update)`: best when you know iteration count. Loop variable is scoped inside only.","**while** checks condition BEFORE each iteration. If condition is false at start, body never runs. Ensure the condition can become false or you create an infinite loop!","**do-while** executes body FIRST, then checks condition. Guaranteed minimum one execution. Useful for input loops where you need to read before validating.","**Enhanced for-each** `for(Type item : collection)`: the cleanest way to iterate. No index management. Works with arrays and anything Iterable. Use it whenever you don't need the index.","**break** exits the loop immediately. **continue** skips to next iteration."],
     code:"public class Loops {\n    public static void main(String[] args) {\n\n        // CLASSIC FOR — known count\n        for (int i = 1; i <= 5; i++) {\n            System.out.print(i + \" \"); // 1 2 3 4 5\n        }\n        System.out.println();\n\n        // COUNTDOWN\n        for (int i = 10; i >= 1; i--) {\n            System.out.print(i + \" \");\n        }\n        System.out.println(\"LAUNCH!\");\n\n        // WHILE — condition-driven\n        int energy = 100;\n        while (energy > 0) {\n            System.out.println(\"Coding... energy: \" + energy);\n            energy -= 30;\n        }\n        System.out.println(\"Need coffee!\");\n\n        // DO-WHILE — runs at least once\n        int attempts = 0;\n        do {\n            System.out.println(\"Attempt #\" + (++attempts));\n        } while (attempts < 3);\n\n        // FOR-EACH — cleanest iteration!\n        String[] languages = {\"Java\", \"Kotlin\", \"Python\", \"Rust\"};\n        for (String lang : languages) {\n            System.out.println(\"Learning: \" + lang);\n        }\n\n        // BREAK and CONTINUE\n        for (int i = 0; i < 10; i++) {\n            if (i == 3) continue; // skip 3\n            if (i == 7) break;    // stop at 7\n            System.out.print(i + \" \"); // 0 1 2 4 5 6\n        }\n        System.out.println();\n\n        // NESTED LOOPS — multiplication table\n        for (int i = 1; i <= 3; i++) {\n            for (int j = 1; j <= 3; j++) {\n                System.out.printf(\"%4d\", i * j);\n            }\n            System.out.println();\n        }\n        //    1   2   3\n        //    2   4   6\n        //    3   6   9\n    }\n}",
     tips:["Prefer for-each when you don't need the index — cleaner and avoids off-by-one bugs","Make sure while loop condition can eventually become false — or infinite loop!","break exits entirely, continue just skips to next iteration","Nested loops = O(n²) complexity — avoid for large datasets"],
     quiz:{q:"Which loop is guaranteed to execute its body at least once?",opts:["for loop","while loop","do-while loop","for-each loop"],correct:2}}
  ]},
  {title:"OOP",icon:"🏗️",color:"#8B5CF6",lessons:[
    {emoji:"🏠",title:"Classes & Objects",tagline:"The heart of Java — blueprints and instances",
     analogy:"A Class is an architectural blueprint. An Object is the actual building made from that blueprint. One blueprint → 1000 different buildings. Each building has its own state (color, size) but same structure. In code: the Car class defines WHAT a car has and does. Each Car object is a specific car in memory with its own data.",
     content:["**Fields** (instance variables) store the object's state. Make them `private` — this is **encapsulation**: hide data, expose only what you need through public methods. Direct field access is a design smell.","**Methods** define behavior. **Constructors** are special methods with the class name and no return type, called with `new` to initialize a fresh object. `this` refers to the current object instance.","**Getters and Setters** (accessors/mutators) provide controlled access to private fields. Setters can VALIDATE data before allowing changes — this is how you protect your object's integrity.","**`toString()`** — override this to provide meaningful text representation. Java calls it automatically when you pass an object to `println()`."],
     code:"// The Blueprint\npublic class BankAccount {\n\n    // PRIVATE fields — nobody touches these directly!\n    private String owner;\n    private double balance;\n    private String accountId;\n\n    // CONSTRUCTOR — called when new BankAccount(...) is used\n    public BankAccount(String owner, double initialBalance) {\n        this.owner = owner;          // this.field = parameter\n        this.balance = initialBalance;\n        this.accountId = \"ACC-\" + (int)(Math.random() * 9000 + 1000);\n    }\n\n    // METHODS — controlled behaviors\n    public void deposit(double amount) {\n        if (amount <= 0) throw new IllegalArgumentException(\"Must be positive!\");\n        balance += amount;\n        System.out.printf(\"Deposited %.2f. Balance: %.2f%n\", amount, balance);\n    }\n\n    public boolean withdraw(double amount) {\n        if (amount > balance) { System.out.println(\"Insufficient funds!\"); return false; }\n        balance -= amount;\n        System.out.printf(\"Withdrew %.2f. Balance: %.2f%n\", amount, balance);\n        return true;\n    }\n\n    // GETTERS — read access\n    public String getOwner() { return owner; }\n    public double getBalance() { return balance; }\n    public String getAccountId() { return accountId; }\n    // No setBalance() — only deposit/withdraw! Encapsulation!\n\n    @Override\n    public String toString() {\n        return accountId + \" [\" + owner + \"]: $\" + balance;\n    }\n}\n\n// USING IT\npublic class Main {\n    public static void main(String[] args) {\n        BankAccount alice = new BankAccount(\"Alice\", 1000
